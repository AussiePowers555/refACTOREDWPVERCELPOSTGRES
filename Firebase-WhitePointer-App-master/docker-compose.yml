version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: whitepointer_db
      POSTGRES_USER: whitepointer_user
      POSTGRES_PASSWORD: whitepointer_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whitepointer_user -d whitepointer_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  whitepointer-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - POSTGRES_URL=postgresql://whitepointer_user:whitepointer_pass@postgres:5432/whitepointer_db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=whitepointer_db
      - POSTGRES_USER=whitepointer_user
      - POSTGRES_PASSWORD=whitepointer_pass
      - DATABASE_DEBUG=true
      - DATABASE_QUERY_LOGGING=true
      - NEXT_PUBLIC_BASE_URL=http://localhost:3000
    volumes:
      # Persist logs
      - ./logs:/app/logs
      # Persist uploads
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local